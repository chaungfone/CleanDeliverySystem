name: cleandelivery
description: "Clean Delivery - Myanmar purified-water delivery mobile app (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/pyidaungsu_Regular.ttf
        - asset: assets/fonts/pyidaungsu_Bold.ttf
          weight: 700
